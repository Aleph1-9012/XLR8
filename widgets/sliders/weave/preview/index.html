<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src data:; base-uri 'none'; form-action 'none'">
<title>Weave</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="slider" aria-label="Weave slider">
  <div class="heading"><label for="level">VOLUME</label><output for="level"><span data-value>13</span>%</output></div>
  <div class="field">
    <div class="drawing" aria-hidden="true">
      <svg class="track-art" xmlns="http://www.w3.org/2000/svg">
        <defs><clipPath id="weave-track"><rect y="3" width="100%" height="30" /></clipPath></defs>
        <path data-weave fill="none" stroke="currentColor" stroke-width=".7" opacity=".7" clip-path="url(#weave-track)" />
      </svg>
      <div class="fill"></div><div class="handle"></div>
    </div>
    <input type="range" id="level" min="0" max="100" step="1" value="13">
  </div>
</div>
<script src="../preview-runtime.js"></script>
<script src="adapter.js"></script>
</body>
</html>
